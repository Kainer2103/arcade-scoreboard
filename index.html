<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Arcade Scoreboard</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

/* =====================================================
GLOBAL
===================================================== */

body{
margin:0;
font-family:'Press Start 2P', cursive;
color:white;
overflow:hidden;
background:black;
}


/* =====================================================
BACKGROUND
===================================================== */

#bgVideo{
position:fixed;
inset:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

body::before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle,
rgba(0,0,0,0.4),
rgba(0,0,0,0.9));
z-index:-1;
}


/* =====================================================
ARCADE CABINET
===================================================== */

.arcade-scene{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.arcade-cabinet{
width:520px;
background:linear-gradient(145deg,#1e1e1e,#0a0a0a);
border:4px solid black;
border-radius:12px;
padding:20px;
box-shadow:0 40px 80px rgba(0,0,0,0.9);
}


/* =====================================================
MARQUEE
===================================================== */

.marquee{
height:80px;
background:#111;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
letter-spacing:2px;
color:#ccc;
margin-bottom:20px;
}


/* =====================================================
SCREEN
===================================================== */

.screen-bezel{
background:#0a0a0a;
padding:20px;
border-radius:8px;
}

.screen-inner{
background:#111;
padding:15px;
border-radius:6px;
}

.screen-content{
background:black;
height:420px;
overflow-y:auto;
padding:10px;
position:relative;
}


/* CRT EFFECT */

.screen-content::before{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
0deg,
rgba(255,255,255,0.03) 0px,
rgba(255,255,255,0.03) 1px,
transparent 1px,
transparent 3px
);
mix-blend-mode:overlay;
}


/* =====================================================
SCOREBOARD
===================================================== */

.frame{
border:2px solid #222;
background:black;
padding:20px;
}

h1{
text-align:center;
color:#00f5ff;
text-shadow:0 0 10px #00f5ff;
margin:10px 0;
}

.trophies{
text-align:center;
font-size:28px;
margin-bottom:10px;
}

.header,.row{
display:grid;
grid-template-columns:60px 150px 100px;
gap:10px;
padding:8px;
font-size:10px;
}

.header{
color:#ff006e;
border-bottom:2px solid #ff006e;
}

.row{
border:2px solid #b620e0;
margin:4px 0;
position:relative;
}

.score-bar{
position:absolute;
left:0;
bottom:0;
height:3px;
background:linear-gradient(90deg,#ff006e,#00f5ff);
}

.insert{
text-align:center;
margin-top:15px;
color:#ffff00;
animation:blink 1.5s infinite;
}

@keyframes blink{
50%{opacity:0}
}


/* =====================================================
FILTERS
===================================================== */

.filters{
display:flex;
justify-content:center;
gap:10px;
margin-bottom:10px;
font-size:8px;
}

.filters span{
cursor:pointer;
padding:4px 6px;
border:1px solid #444;
color:#888;
}

.filters span.active{
color:#ffcc00;
border-color:#ffcc00;
}


/* =====================================================
HEATMAP
===================================================== */

#heatmapScreen{
display:none;
flex-direction:column;
align-items:center;
}

.heatTitle{
color:#00f5ff;
margin-bottom:10px;
font-size:10px;
}

.monthSelector{
display:flex;
flex-wrap:wrap;
gap:6px;
justify-content:center;
font-size:7px;
margin-bottom:10px;
}

.monthSelector span{
cursor:pointer;
border:1px solid #00f5ff33;
padding:3px 5px;
color:#00f5ff88;
}

.monthSelector span.active{
color:#ffcc00;
border-color:#ffcc00;
}

#heatmapGrid{
display:grid;
grid-template-columns:repeat(7,20px);
gap:6px;
}

.heatCell{
width:20px;
height:20px;
border-radius:3px;
background:#111;
}


/* =====================================================
CONTROL PANEL
===================================================== */

.control-panel{
background:#111;
border-radius:6px;
padding:20px;
display:flex;
justify-content:space-between;
margin-top:20px;
}


/* =====================================================
JOYSTICK
===================================================== */

.joystick{
position:relative;
width:100px;
height:100px;
}

.base{
position:absolute;
bottom:0;
left:10px;
width:80px;
height:20px;
background:#222;
border-radius:10px;
}

.stick{
position:absolute;
bottom:20px;
left:48px;
width:10px;
height:70px;
background:#555;
transform-origin:bottom;
transition:transform 0.15s;
}

.ball{
position:absolute;
top:-20px;
left:-14px;
width:40px;
height:40px;
background:red;
border-radius:50%;
}


/* =====================================================
BUTTONS
===================================================== */

.buttons{
display:flex;
gap:18px;
}

.button-ring{
background:#111;
padding:6px;
border-radius:50%;
}

.btn{
width:36px;
height:36px;
border-radius:50%;
background:#c40000;
cursor:pointer;
position:relative;
}

.btn-label{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
font-size:16px;
}


/* =====================================================
TOOLTIP
===================================================== */

#heatTooltip{
position:fixed;
display:none;
background:black;
color:#00f5ff;
font-size:8px;
padding:8px;
border:1px solid #00f5ff;
pointer-events:none;
}

</style>

</head>


<body>


<!-- ========================================= -->
<!-- BACKGROUND -->
<!-- ========================================= -->

<video autoplay muted loop playsinline id="bgVideo">
<source src="cyber-punk.mp4" type="video/mp4">
</video>

<audio id="bgMusic" src="05. Silver.mp3" loop></audio>
<audio id="btnSound" src="button-click.mp3"></audio>


<!-- ========================================= -->
<!-- ARCADE MACHINE -->
<!-- ========================================= -->

<div class="arcade-scene">

<div class="arcade-cabinet">

<div class="marquee">ARCADE BOARD</div>


<div class="screen-bezel">
<div class="screen-inner">
<div class="screen-content">


<!-- VIDEO -->

<video id="arcadeCutscene" style="display:none;width:100%;height:100%;object-fit:cover">
<source src="motive-video.mp4" type="video/mp4">
</video>


<!-- HEATMAP -->

<div id="heatmapScreen">

<div class="heatTitle">MONTH VIEW</div>

<div class="monthSelector">

<span data-month="0">JAN</span>
<span data-month="1">FEB</span>
<span data-month="2">MAR</span>
<span data-month="3">APR</span>
<span data-month="4">MAY</span>
<span data-month="5">JUN</span>
<span data-month="6">JUL</span>
<span data-month="7">AUG</span>
<span data-month="8">SEP</span>
<span data-month="9">OCT</span>
<span data-month="10">NOV</span>
<span data-month="11">DEC</span>

</div>

<div id="heatmapGrid"></div>

</div>


<!-- SCOREBOARD -->

<div class="container">

<div class="frame">

<div class="filters">
<span data-filter="all" class="active">ALL</span>
<span data-filter="month">MONTH</span>
<span data-filter="week">WEEK</span>
</div>

<h1>HIGH SCORE</h1>

<div class="trophies">🏆 👑 🏆</div>

<div id="board"></div>

<div class="insert">▲ INSERT COIN ▲</div>

</div>

</div>


</div>
</div>
</div>


<!-- CONTROL PANEL -->

<div class="control-panel">

<div class="joystick">
<div class="base"></div>
<div class="stick"><div class="ball"></div></div>
</div>

<div class="buttons">

<div class="button-ring"><div class="btn"></div></div>

<div class="button-ring"><div class="btn" id="heatmapBtn"></div></div>

<div class="button-ring">
<div class="btn" id="soundToggle">
<span class="btn-label">🔊</span>
</div>
</div>

<div class="button-ring">
<div class="btn" id="playCutscene">
<span class="btn-label">▶</span>
</div>
</div>

</div>

</div>

</div>
</div>


<div id="heatTooltip"></div>


<script>

/* =============================
CONFIG
============================= */

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQzWlByVkCzcn8bGO9kPYH7eKkBJwDsPJjTqotjaWmOCopmy0rjA5b-RlVQ__pEBxDtHIpaUut19E5z/pub?output=csv";

const board=document.getElementById("board");
const grid=document.getElementById("heatmapGrid");
const tooltip=document.getElementById("heatTooltip");

let selectedMonth=new Date().getMonth();
let currentFilter="all";

/* =============================
LOAD DATA
============================= */

async function load(){

board.innerHTML='<div style="text-align:center">LOADING...</div>';

try{

const r=await fetch(CSV_URL+"&t="+Date.now());
const t=await r.text();

const data=parseCSV(t);

renderBoard(data);
renderHeatmap(data);

}catch(e){

board.innerHTML='<div style="text-align:center;color:red">FAILED TO LOAD</div>';

}

}

/* =============================
CSV PARSE
============================= */

function parseCSV(text){

const rows=text.trim().split("\n").slice(1);

return rows.map(r=>{
const c=r.split(",");
return{
date:c[0],
score:Number(c[1])
};
});

}

/* =============================
RENDER BOARD
============================= */

function renderBoard(data){

const filtered=data.sort((a,b)=>b.score-a.score);

board.innerHTML=`<div class="header"><div>RANK</div><div>DATE</div><div>SCORE</div></div>`;

filtered.forEach((r,i)=>{

board.innerHTML+=`
<div class="row">
<div>#${i+1}</div>
<div>${r.date}</div>
<div>${r.score}</div>
<div class="score-bar" style="width:${r.score*2}%"></div>
</div>`;

});

}

/* =============================
HEATMAP
============================= */

function renderHeatmap(data){

grid.innerHTML="";

const year=new Date().getFullYear();
const days=new Date(year,selectedMonth+1,0).getDate();

for(let d=1;d<=days;d++){

const cell=document.createElement("div");
cell.classList.add("heatCell");

grid.appendChild(cell);

}

}

/* =============================
INIT
============================= */

load();
setInterval(load,30000);

</script>

</body>
</html>
